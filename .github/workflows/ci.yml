name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl

      - name: Lint PHP files
        run: find app public templates tests scripts -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

      - name: Run test suite
        run: php tests/run.php
